name: Off-box backup

# Snapshots live on the Railway volume, which is exactly what a volume loss
# destroys. This pulls one to GitHub every day so a copy exists elsewhere.
#
# Requires two repository secrets:
#   APP_URL      https://your-app.up.railway.app   (no trailing slash)
#   ADMIN_TOKEN  the same value set on the Railway service
on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch: {}

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      # This workflow is opt-in: it can't do anything until someone sets the
      # two secrets. Failing the run in that state would paint the repo red
      # every night forever, and a nightly alarm that is always ringing is one
      # nobody reads — which is exactly the alarm you need working the night a
      # real backup breaks. So an unconfigured repo skips cleanly and says so,
      # and only a configured-but-broken pull fails.
      - name: Check configuration
        id: check
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Off-box backups are not set up: add the APP_URL and ADMIN_TOKEN repository secrets to enable them. Skipping."
            {
              echo "### Off-box backup skipped"
              echo
              echo "No snapshot was pulled because this repository has no backup secrets set."
              echo "To turn nightly off-box backups on, add both repository secrets:"
              echo
              echo "| Secret | Value |"
              echo "| --- | --- |"
              echo '| `APP_URL` | your deployed URL, no trailing slash |'
              echo '| `ADMIN_TOKEN` | the same value set on the Railway service |'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull snapshot
        if: steps.check.outputs.configured == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out
          code=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -D out/headers.txt -o "out/backup.json.gz" \
            -w '%{http_code}' "${APP_URL}/api/admin/backup")
          echo "HTTP ${code}"
          # a snapshot that won't gunzip is not a backup
          gunzip -t "out/backup.json.gz"
          node -e '
            const s = JSON.parse(require("zlib").gunzipSync(
              require("fs").readFileSync("out/backup.json.gz")).toString());
            if (!s.version || !s.counts) throw new Error("snapshot missing version/counts");
            if (!s.counts.users) throw new Error("snapshot contains zero users — refusing to call this good");
            console.log(`snapshot ${s.createdAt}:`, JSON.stringify(s.counts));
          '
          rm -f out/headers.txt

      - name: Store snapshot
        if: steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: out/backup.json.gz
          retention-days: 90
          if-no-files-found: error
