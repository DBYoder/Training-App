<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>MARATHON//TRAINER</title>
  <link rel="stylesheet" href="css/styles.css?v=7">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23050508%22/><text x=%2250%22 y=%2272%22 font-size=%2264%22 font-family=%22monospace%22 font-weight=%22bold%22 fill=%22%2300f5ff%22 text-anchor=%22middle%22>//</text></svg>">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1>MARATHON<span class="slash">//</span>TRAINER</h1>
      <span id="countdown-chip" class="countdown-chip" hidden></span>
    </div>
    <nav id="tabs" class="tabs" role="tablist" hidden>
      <button data-tab="today" class="active" role="tab" aria-selected="true">Today</button>
      <button data-tab="schedule" role="tab" aria-selected="false">Schedule</button>
      <button data-tab="progress" role="tab" aria-selected="false">Progress</button>
      <button data-tab="plans" role="tab" aria-selected="false">Plans</button>
      <button data-tab="settings" role="tab" aria-selected="false">Settings</button>
    </nav>
  </header>

  <main>
    <!-- Login / registration -->
    <section id="auth" hidden>
      <div class="setup-card auth-card">
        <h2 id="auth-title">Sign in</h2>
        <p class="auth-blurb">Track your training: pick or upload a plan, schedule it around
        your goal race, and journal every workout.</p>
        <form id="auth-form">
          <label>Email
            <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
          </label>
          <label>Password
            <input type="password" name="password" required minlength="8"
                   autocomplete="current-password" placeholder="at least 8 characters">
          </label>
          <p id="auth-error" class="sync-error" hidden></p>
          <button type="submit" class="btn primary" id="auth-submit">Sign in</button>
        </form>
        <p class="auth-switch">
          <span id="auth-switch-label">New here?</span>
          <a href="#" id="auth-switch-link">Create an account</a>
        </p>
      </div>
    </section>

    <!-- Main app -->
    <div id="app-main" hidden>
      <section id="tab-today" class="tab-panel"></section>
      <section id="tab-schedule" class="tab-panel" hidden></section>
      <section id="tab-progress" class="tab-panel" hidden></section>
      <section id="tab-plans" class="tab-panel" hidden></section>
      <section id="tab-settings" class="tab-panel" hidden></section>
    </div>
  </main>

  <!-- Day detail + journal modal -->
  <dialog id="day-modal" aria-labelledby="modal-title">
    <button id="modal-close" class="modal-close" aria-label="Close">✕</button>
    <div class="modal-body"></div>
  </dialog>

  <footer class="app-footer">
    <p>marathon//trainer — your data syncs to your account</p>
  </footer>

  <script src="js/plan.js?v=7"></script>
  <script src="js/planParser.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
</body>
</html>
